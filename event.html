    <title>Demo Event</title>
</head>
<body>
    <button type="button" >Button demo</button>
    
    <div class="control">
        <button type="button" onclick="off()">OFF</button>

        <button type="button" onclick="speed2()">Speed 2</button>
        <button type="button" onclick="speed3()">Speed 3</button>

    <input id="input" type="text" name="search" placeholder="abc..." onkeyup="key1()">

    <select name="city" id="" onchange="key2()">
        <option value="hn">Ha Noi</option>
        <option value="dn">Da Nang</option>
        <option value="hcm">Ho Chi Minh</option>
    </select>
    <br><br><br><br><br>
    <div class="fan">
        <img src="images/bird.jpg" alt="" id="fan"/>
    </div>
    
    <script type="text/javascript" src="js/demo3.js"></script>
