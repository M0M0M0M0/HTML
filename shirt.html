<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <title>Shirt Product</title>
    <style>
        .my-card{
            border: none;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 1rem;
        }
        .my-button{
            border: none;
            background-color: white;
            padding: 1rem;
        }
        .my-button2{
            background-color: rgb(60, 60, 60);
            border-color: rgb(60, 60, 60);
        }
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">
            
        </div>
    </div>
    <script type="text/javascript">
        function mypham() {
            const URL = "https://dummyjson.com/products?limit=20";
            fetch(URL)
                .then(res => res.json())
                .then(data => {
                    if (data && data.products && data.products.length > 0) {
                        renderProducts(data);
                    }
                    function renderProducts(data) {
                        const products = data.products;
                        const container = document.querySelector('.row');
                        container.innerHTML = ''; // Clear existing content

                        products.forEach(product => {
                            const col = document.createElement('div');
                            col.className = 'col-xl-3 col-lg-3 col-lg-4 mb-4';

                            col.innerHTML = `
                            <div class="card h-100 d-flex flex-column my-card">
                                <div class="card-body flex-grow-1">
                                    <img src="${product.thumbnail}" alt="${product.title}" class="img-fluid product-img">
                                    <h2 class="product-name">${product.title}</h2>
                                    <p>
                                        $ <span class="description">${product.price}</span>
                                    </p>
                                </div>
                                <p class="description">${product.description}</p>
                                <div class="card-footer mt-auto my-button">
                                    <button type="button" class="btn btn-primary my-button2">Add to cart</button>
                                </div>
                            </div>
                        `;

                            container.appendChild(col);
                        });
                    }
                });
        }
        mypham();
    </script>
</body>

</html>
</div>
</div>

</body>

</html>
