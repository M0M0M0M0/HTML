<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dự báo thời tiết</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
</head>

<body class="bg-secondary p-3">

    <div class="container">

        <div class="card text-center mb-4 shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Thời tiết hiện tại</h2>
                <div id="current-temp" class="display-4 fw-bold">--°C</div>
                <div id="current-desc" class="text-muted">---</div>
            </div>
        </div>


        <div id="forecast-container" class="row g-3"></div>
    </div>

    <script>
        function thoitiet() {
            const URL = "https://api.openweathermap.org/data/2.5/forecast?q=hanoi&appid=09a71427c59d38d6a34f89b47d75975c&units=metric";

            fetch(URL)
                .then(res => res.json())
                .then(data => {
                    if (data.list && data.list.length > 0) {
                        const dulieu = data.list[0];
                        document.getElementById('current-temp').innerText = dulieu.main.temp.toFixed(1) + "°C";
                        document.getElementById('current-desc').innerText = capitalizeFirst(dulieu.weather[0].description);
                        renderForecast(data.list);
                    }
                })
                .catch(err => console.error(err));

            function renderForecast(list) {
                const container = document.getElementById('forecast-container');
                container.innerHTML = '';

                list.forEach(item => {
                    const dt_txt = item.dt_txt;
                    const temp = item.main.temp.toFixed(1);
                    const desc = item.weather[0].description;
                    const icon = item.weather[0].icon;

                    const card = document.createElement('div');
                    card.className = 'col-6 col-md-3 col-lg-2';

                    card.innerHTML = `
                        <div class="card text-center h-100 shadow-sm">
                        <div class="card-body p-2 ">
                        <div class="small text-muted">${dt_txt}</div>
                        <img src="https://openweathermap.org/img/wn/${icon}.png" alt="${desc}" class="img-fluid" style="max-width:60px;">
                        <div class="fw-bold">${temp}°C</div>
                        <div class="text-capitalize small">${desc}</div>
                        </div>
                        </div>
                        `;

                    container.appendChild(card);
                });
            }

            function capitalizeFirst(s) {
                return s.charAt(0).toUpperCase() + s.slice(1);
            }
        }
        thoitiet();
    </script>
</body>

</html>
