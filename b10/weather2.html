<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="weather2.css">
  <title>Dự báo thời tiết</title>
  </head>
<body>

  
  <div class="weather-box">
    <h2>Thời tiết hiện tại</h2>
    <div class="temp" id="current-temp">--°C</div>
    <div id="current-desc">---</div>
  </div>

  
  <div class="forecast-container" id="forecast-container"></div>

  <script type="text/javascript">
    const URL = "https://api.openweathermap.org/data/2.5/forecast?q=hanoi&appid=09a71427c59d38d6a34f89b47d75975c&units=metric"; 

    fetch(URL)
      .then(res => res.json())
      .then(data => {
        if (data.list && data.list.length > 0) {
        
          const current = data.list[0];
          document.getElementById('current-temp').innerText = current.main.temp.toFixed(1) + "°C";
          document.getElementById('current-desc').innerText = capitalizeFirst(current.weather[0].description);

          
          renderForecast(data.list);
        }
      })
      .catch(err => console.error(err));

    function renderForecast(list) {
      const container = document.getElementById('forecast-container');
      container.innerHTML = '';

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'forecast-card';

        const dt_txt = item.dt_txt;
        const temp = item.main.temp.toFixed(1);
        const desc = item.weather[0].description;
        const icon = item.weather[0].icon;

        card.innerHTML = `
          <div class="time">${dt_txt}</div>
          <img class="icon" src="https://openweathermap.org/img/wn/${icon}.png" alt="${desc}">
          <div class="temp">${temp}°C</div>
          <div class="desc">${capitalizeFirst(desc)}</div>
        `;

        container.appendChild(card);
      });
    }

    function capitalizeFirst(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
  </script>

</body>
</html>
