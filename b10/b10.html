<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/layout.css">
    <title>Document</title>
</head>
<body>
    <main class="section main">
        <div class="container">
            <h1 id="sp_name">vay thoi trang cao cap danh cho hoa hau</h1>
            <p>Gia tien: <span id="price">12</span>$</p>
            <p>So luong: <Span id="qty">3</Span></p>
            <script type="text/javascript">
                var sp = {
                    name: "Tui Gucci",
                    price: 20,
                    qty: 30
                }
                var sp_name = document.getElementById("sp_name");
                sp_name.innerHTML = sp.name;
                var price = document.getElementById("price");
                price.innerHTML = sp.price; 
                var qty = document.getElementById("qty");
                qty.innerHTML = sp.qty;
            </script>
        </div>
    </main>
</body>
</html>
