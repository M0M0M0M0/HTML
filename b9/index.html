<html lang="en">
<head>

  <title>Popup</title>
  <link rel="stylesheet" href="b9.css" />
</head>
<body>
  <div class="container">
    <button id="openModal">Show Modal</button>
  </div>

  <div class="modal-overlay" id="modal">

      <button class="close" id="closeModal">&times;</button>
      <h2>Create a post</h2>
      <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Voluptas iste ipsum deserunt alias eaque praesentium dolores quae aliquam non voluptates, unde consequatur totam nihil porro vero? Facere odio nisi eum!</p>
      <label for="campaign">Campaign Name</label>
      <input type="text" id="campaign" placeholder="Ex. Get 50% off" />
      <div class="buttons">
        <button class="continue">Continue</button>
        <button class="cancel" id="closeModal2">Cancel</button>
      </div>
    </div>
  </div>

  <script src="b9.js"></script>
</body>
</html>
