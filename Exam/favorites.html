<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites</title>
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/exam.css" />
    <link rel="stylesheet" href="css/movies.css" />
</head>

<body>
    <div class="container">
        <header>
            <a href="exam.html" id="logo-link">
                <h1>⭐ MyFilm</h1>
            </a>
            <nav>
                <a href="about.html">About Us</a>
                <a href="movies.html">Movies</a>
                <a href="favorites.html">Favorites</a>
                <input type="text" placeholder="Enter some keywords" class="search-input" />
            </nav>
        </header>

        <div class="a-left">
            <aside class="sidebar">
                <form>
                    <label><input type="checkbox"> Action</label><br>
                    <label><input type="checkbox"> Adventure</label><br>
                    <label><input type="checkbox"> Romance</label><br>
                    <label><input type="checkbox"> Documentary</label><br>
                    <label><input type="checkbox"> War</label><br>
                    <label><input type="checkbox"> Sport</label><br>
                    <label><input type="checkbox"> Musical</label><br>
                    <label><input type="checkbox"> Family</label>
                </form>
            </aside>
        </div>

        <main class="movie-content">
            <h1>Your Favorite Movies</h1>
            <div class="movie-grid">
                <div class="movie-card">
                    <img src="images/thepost.png" alt="The Post">
                    <h3>The Post</h3>
                </div>
                <div class="movie-card">
                    <img src="images/thegodfather.png" alt="The Godfather">
                    <h3>The Godfather</h3>
                </div>
                <div class="movie-card">
                    <img src="images/titanic.png" alt="Titanic">
                    <h3>Titanic</h3>
                </div>
                <div class="movie-card">
                    <img src="images/lion.png" alt="Lions">
                    <h3>Lions</h3>
                </div>
                <div class="movie-card">
                    <img src="images/avatar.png" alt="Avatar">
                    <h3>Avatar</h3>
                </div>
                <div class="movie-card">
                    <img src="images/parasite.png" alt="Parasite">
                    <h3>Parasite</h3>
                </div>
            </div>
        </main>

        <footer class="site-footer">
            <div class="footer-container">
                <img src="images/cuonphim.png" alt="Cuộn phim" class="film-icon" />
                <span class="footer-text">Blue Entertainment</span>
                <p>&copy; 2025 My Website. All rights reserved.</p>
                <ul class="footer-links">
                    <li><a href="#">Privacy Policy</a></li>
                    <li><a href="#">Terms of Service</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
        </footer>
    </div>
</body>

</html>
